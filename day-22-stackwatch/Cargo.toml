[package]
name = "stackwatch"
version = "0.1.0"
edition = "2021"
description = "macOS notch HUD for herding AI agent CLIs: spawn, monitor, and talk to every agent from the Dynamic Island."

[[bin]]
name = "stackwatch"
path = "src/main.rs"

[[bin]]
name = "simulate"
path = "src/simulate.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.29"
egui = "0.29"
# Brand marks in the notch are the whole point of the HUD — `svg` pulls the resvg
# rasterizer so the logos stay crisp at any notch scale. Assets: assets/logos/ (svgl.app).
egui_extras = { version = "0.29", features = ["svg"] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
# Native folder picker for the launch form's "Browse…" — replaces hand-rolled NSOpenPanel FFI.
rfd = "0.14"
portable-pty = "0.9"
vt100 = "0.16"

# Pinned to the versions winit 0.30 already pulls in, so this adds no extra compile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = "0.2.2"
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"

[dev-dependencies]
tokio-test = "0.4"
